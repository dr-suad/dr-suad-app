<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>د. سعاد قريني | عالم الرياضيات الممتع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --or:#F4A261; --ye:#E9C46A; --ol:#6A994E; --te:#2A9D8F;
  --bg:#FFF8F0; --card:#fff; --tx:#3D3D3D;
  --ok:#2f7d32; --bad:#c0392b; --sh:0 6px 18px rgba(61,61,61,.09);
}
:root[data-theme=light]{color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1913;--card:#2a241c;--tx:#f3eadf;--sh:0 6px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
h1,h2,h3,.q,.num{font-family:Cairo,sans-serif;line-height:1.4}
.c{max-width:1200px;margin:auto;padding-inline:16px}
section{padding-block:40px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ol);outline-offset:2px}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);box-shadow:var(--sh)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.hd h1{font-size:1.5rem;font-weight:800;color:var(--or)}
.hd p{font-size:.75rem;color:#555}
nav{display:none;flex-direction:column;padding-block:8px}
nav.a{display:flex}
nav .c{display:flex;flex-direction:column;gap:4px}
nav a{color:var(--tx);text-decoration:none;font-weight:700;padding:10px 12px;border-radius:10px;transition:background .2s}
nav a:hover{background:#eee3;text-decoration:none}
.bg{background:var(--or);border:0;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px}
.bg i{width:22px;height:3px;background:#fff;border-radius:2px}
@media(min-width:1024px){.bg{display:none}nav{display:block}nav.a{display:none}nav .c{flex-direction:row;justify-content:center;flex-wrap:wrap}}
.hero{padding:44px 18px;text-align:center;background:linear-gradient(135deg,var(--ye),var(--or)),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity=".15"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/></svg>');color:#3a2a14}
.hero h2{font-size:clamp(1.8rem,6vw,2.9rem);font-weight:800;margin-bottom:8px;letter-spacing:-.5px}
.hero p{margin-bottom:18px;font-weight:500;font-size:1.15rem}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.dots b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:Cairo;font-size:1.6rem;color:#fff;box-shadow:var(--sh)}
.btn{background:var(--ol);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-weight:700;font-size:1.05rem;text-decoration:none;display:inline-block;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn.lg{font-size:1.2rem;padding:14px 38px}
.badge{display:inline-block;background:#fff;border:2px solid var(--or);color:var(--or);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.85rem;margin-bottom:16px}
.about{padding:40px;text-align:center}
.about .av{width:110px;height:110px;border-radius:50%;background:var(--ye);display:grid;place-items:center;font-size:3.4rem;margin-bottom:14px}
.about h2{font-size:1.7rem}
.about p{max-width:720px;margin:12px auto 20px;font-size:1.1rem}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.feature{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:20px;border-top:6px solid var(--or);text-align:right}
.feature h3{font-size:1.15rem;margin-bottom:8px}
.feature p{font-size:.95rem;color:#555}
.grades .t{font-size:1.5rem;margin-bottom:14px;padding-right:12px;border-right:6px solid var(--ol)}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.gc{cursor:pointer;width:100%;text-align:right;border-inline:0;border-bottom:0;color:var(--tx);background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px}
.gc:hover{transform:translateY(-3px);border-top:6px solid var(--ol)}
.gc .num{width:44px;height:44px;border-radius:50%;background:var(--k);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.gc .em{font-size:1.8rem;margin:6px 0}
.gc h3{font-size:1.15rem;margin-bottom:6px}
.gc p{font-size:.95rem;color:#555}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}
.badge-item{background:var(--card);border-radius:14px;padding:16px;text-align:right;box-shadow:var(--sh);border-inline:0}
.badge-item .em{font-size:2rem;margin-bottom:6px}
.badge-item h4{font-size:1rem;font-weight:800}
.badge-item p{font-size:.9rem;color:#555}
.cta{width:min(100%,600px);margin:30px auto;text-align:center}
.cta h2{font-size:1.7rem}
.cta p{font-size:1.1rem;margin:8px 0 18px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.contact div{background:var(--card);border-radius:16px;padding:18px;text-align:right;box-shadow:var(--sh);border-top:6px solid var(--ye)}
.contact div h5{font-size:.85rem;color:#777}
.contact div a{display:inline-block;margin-top:6px;font-weight:700;color:var(--ol)}
footer{margin:40px 0;text-align:center;font-weight:800;color:#fff;background:var(--ol);padding:22px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media(max-width:600px){
  nav .c{flex-direction:column}
  .dots b{width:44px;height:44px;font-size:1.3rem}
}

<!-- Hero -->
<section class="hero" id="home">
  <div class="dots">
    <b style="background:#F4A261">١</b>
    <b style="background:#E9C46A">٢</b>
    <b style="background:#6A994E">٣</b>
    <b style="background:#2A9D8F">٤</b>
  </div>
  <h2>أهلاً بكم في عالم الرياضيات الممتع</h2>
  <p>تدرّب، وعّب، واجمع النجوم مع د. سعاد</p>
  <a href="#grades" class="btn lg">استكشف الصفوف</a>
  <span class="badge">📚 الأساسي من الأول إلى الرابع — المنهاج الفلسطيني</span>
</section>

<!-- About -->
<section class="about" id="about">
  <div class="av">👩🏫</div>
  <h2>د. سعاد قريني</h2>
  <p>معلمة رياضيات متخصصة في المرحلة الأساسية الدنيا، تتبع المنهاج الفلسطيني المعتمد.</p>
  <p>طريقة تعليمي مختلطة: شرح للمفاهيم مع تمارين تفاعلية، ألعاب حركية، فيديوهات قصيرة، ومتابعة مستمرة لكل طالب.</p>
</section>

<!-- Features -->
<section id="features">
  <h2 class="t" style="border-right-color:var(--ol)">محتواي التعليمي</h2>
  <div class="features">
    <div class="feature" style="--k:var(--or)">
      <div class="em" style="color:var(--or)">📋</div>
      <h3>الخطط الفصلية</h3>
      <p>خطة دروس منظمة ترتبط كل درس بموضوعاته وتقييماته.</p>
    </div>
    <div class="feature" style="--k:var(--ye)">
      <div class="em" style="color:#7a6420">📘</div>
      <h3>التحضيرات</h3>
      <p>تحضير كامل لكل درس: مقدمة، شروح، مثال، وتمارين.</p>
    </div>
    <div class="feature" style="--k:var(--ol)">
      <div class="em" style="color:#fff">🖨️</div>
      <h3>أوراق العمل</h3>
      <p>أوراق عمل عادية (قابلة للطباعة بصيغة PDF) وأخرى رقمية تفاعلية.</p>
    </div>
    <div class="feature" style="--k:var(--te)">
      <div class="em" style="color:#fff">🎥</div>
      <h3>الفيديوهات</h3>
      <p>درس مختصر مرئي (1–2 دقيقة) يسهل الفهم ويذكّر المعلمة.</p>
    </div>
  </div>
</section>

<!-- Grades -->
<section id="grades">
  <h2 class="t">الصفوف الدراسية</h2>
  <div class="dots">
    <b style="background:#F4A261">١</b>
    <b style="background:#E9C46A">٢</b>
    <b style="background:#6A994E">٣</b>
    <b style="background:#2A9D8F">٤</b>
  </div>
  <div class="g">
    <button class="gc" style="--k:#F4A261">
      <div class="num">١</div>
      <div class="em">🧮</div>
      <h3>الصف الأول</h3>
      <p>الأعداد من 1 إلى 9، المقارنة، الجمع والطرح ضمن 9</p>
    </button>
    <button class="gc" style="--k:#E9C46A">
      <div class="num">٢</div>
      <div class="em">🔢</div>
      <h3>الصف الثاني</h3>
      <p>الأعداد ضمن 99، الجمع والطرح، مفهوم الضرب والقسمة</p>
    </button>
    <button class="gc" style="--k:#6A994E">
      <div class="num">٣</div>
      <div class="em">➗</div>
      <h3>الصف الثالث</h3>
      <p>الكسور، القسمة، المسائل الحياتية، وحدات القياس</p>
    </button>
    <button class="gc" style="--k:#2A9D8F">
      <div class="num">٤</div>
      <div class="em">📐</div>
      <h3>الصف الرابع</h3>
      <p>ضرب الأعداد، الكسور العشرية، المحيط والمساحة، تنظيم البيانات</p>
    </button>
  </div>
</section>

<!-- Why + how it works -->
<section id="why">
  <h2 class="t">لماذا تختار د. سعاد؟</h2>
  <div class="badges">
    <div class="badge-item" style="--k:var(--or)">
      <div class="em" style="color:var(--or)">🎯</div>
      <h4>تدريب فوري</h4>
      <p>كل إجابة تتحول فوراً إلى نتيجة، والطالب يكتشف خطأه.</p>
    </div>
    <div class="badge-item" style="--k:var(--ye)">
      <div class="em" style="color:#7a6420">⭐</div>
      <h4>نظام النجوم</h4>
      <p>يتراكم المتعلم نجوماً معاً، ويحفّز على المزيد من التدرّب.</p>
    </div>
    <div class="badge-item" style="--k:var(--ol)">
      <div class="em" style="color:#fff">🧠</div>
      <h4>تقييم حقيقي</h4>
      <p>تقييم دقيق لمستوى كل طالب وفق معايير المنهاج.</p>
    </div>
    <div class="badge-item" style="--k:var(--te)">
      <div class="em" style="color:#fff">🏃</div>
      <h4>ألعاب حركية</h4>
      <p>ربط الرياضيات بالحركة والألعاب الجسدية للتربية الشاملة.</p>
    </div>
  </div>
</section>

<!-- CTA -->
<section class="cta" id="contact">
  <h2>جاهز لبدء رحلة تعلم ممتعة؟</h2>
  <p>انقر على صفك المفضل، وابدأ التدريب، وساعدي طفلك على الفوز بالنجوم.</p>
  <a href="#grades" class="btn lg">استكشف الصفوف الآن</a>
</section>

<!-- Contact -->
<section id="contact">
  <div class="contact">
    <div>
      <h5>📱 الهاتف</h5>
      <a href="tel:+970000000000">00970 000 000 000</a>
    </div>
    <div>
      <h5>✉️ البريد الإلكتروني</h5>
      <a href="mailto:contact@drsuad.com">contact@drsuad.com</a>
    </div>
    <div>
      <h5>📍 الموقع</h5>
      <p>فلسطين — الأساسي (الصف الأول إلى الرابع)</p>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <p>© د. سعاد قريني — صُنع بـ ❤️ لنسّاح ⟐ المنهاج الفلسطيني</p>
</footer>

<script>
document.addEventListener('click', function(e){
  const nav = document.getElementById('nav');
  const h = document.getElementById('bg');
  if(e.target.id === 'bg' || e.target.closest('#bg')){
    const o = nav.classList.toggle('a');
    h.setAttribute('aria-expanded', o);
  }
  const l = e.target.closest('a[href^="#"]');
  if(l){
    e.preventDefault();
    document.querySelector(l.getAttribute('href')).scrollIntoView({behavior:'smooth'});
    nav.classList.remove('a');
    h.setAttribute('aria-expanded','false');
  }
});
</script>
